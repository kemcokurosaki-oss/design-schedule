name: タスク期日通知

on:
  workflow_dispatch:      # cron-job.orgから毎朝9時JSTに起動、または手動実行
    inputs:
      test_mode:
        description: 'テストモード（黒崎のみ送信）'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: パッケージインストール
        run: npm install
      - name: タスク期日通知を送信
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          # gmail または graph（Microsoft 365 の共有メールボックスから送る）
          MAIL_PROVIDER: gmail
          M365_TENANT_ID: ${{ secrets.M365_TENANT_ID }}
          M365_CLIENT_ID: ${{ secrets.M365_CLIENT_ID }}
          M365_CLIENT_SECRET: ${{ secrets.M365_CLIENT_SECRET }}
          M365_SENDER: ${{ secrets.M365_SENDER }}
          TEST_MODE: ${{ github.event.inputs.test_mode || 'false' }}
        run: node scripts/notify.js
