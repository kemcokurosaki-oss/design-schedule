<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>設計工程表</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text x='50' y='75' font-size='80' text-anchor='middle'>📐</text></svg>">
    <!-- DHTMLX Gantt -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/dhtmlx-gantt@9.1.4/codebase/dhtmlxgantt.css" integrity="sha384-TJhQhHZJWAsBfr9FCjKyAahkcyx0PIOhV36fzXFZcjPKgb0ggCTjy9qTo39oyCd4" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/dhtmlx-gantt@9.1.4/codebase/dhtmlxgantt.js" integrity="sha384-nY2tp2pjcypLpyaS7ys9kyJMem0Mtn+AS8o5+K6CeOS/zpVPknaCgz4i/+KR4YP1" crossorigin="anonymous"></script>
    <!-- Pro版（リソース機能）が必要な場合は、ライセンス版のJSを読み込む必要があります -->
    <!-- 以前は cdn.dhtmlx.com/gantt/edge/ を参照していたが、ベンダー側の自動更新でv10.0.0に切り替わり、
         marker/dnd等の拡張構成が変わって編集操作が動作しなくなったため、jsDelivr経由でv9.1.4に固定 -->
    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.3/dist/umd/supabase.js" integrity="sha384-BWcjm9OdFth9TbhCxZPdm+gAOUMAzQy9nmTs12ioXdCcbVnJaPMn+fMUoQCLt60R" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="style.css?v=20261120d">
</head>
<body>
    <div id="page_loading_overlay" style="position:fixed;inset:0;background:#fff;z-index:9999;"></div>
    <!-- 処理中ローディングオーバーレイ -->
    <div id="loading-overlay">
        <div class="loading-spinner">
            <div></div><div></div><div></div><div></div>
            <div></div><div></div><div></div><div></div>
        </div>
        <span class="loading-label">Loading</span>
    </div>
    <div class="main-container">
        <div class="header-panel">
            <div class="header-row" id="filter_btn_row">
                <div class="mode-tabs">
                    <button class="btn btn-filter" id="resource_home_btn" onclick="returnToResourceView()"><svg class="btn-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="8" cy="5.5" r="2.8"/><path d="M2.5 14c.6-3 2.8-4.5 5.5-4.5s4.9 1.5 5.5 4.5"/></svg>担当別</button>
                    <button class="btn btn-filter" id="plan_filter_btn" onclick="togglePlanFilter()"><svg class="btn-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="2" y="3" width="12" height="11" rx="1.5"/><path d="M2 6.5h12M5.5 1.5v3M10.5 1.5v3"/></svg>計画</button>
                    <button class="btn btn-filter" id="drawing_filter_btn" onclick="toggleDrawingFilter()"><svg class="btn-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M2 14l2-.5L13 4.5 11.5 3 2.5 12z"/><path d="M10 4.5 11.5 6"/></svg>図面</button>
                    <button class="btn btn-filter" id="longterm_filter_btn" onclick="toggleLongtermFilter()"><svg class="btn-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M8 1.5 14 4.5v7L8 14.5 2 11.5v-7z"/><path d="M2 4.5 8 7.5l6-3M8 7.5v7"/></svg>長納期品</button>
                    <button class="btn btn-filter" id="trip_filter_btn" onclick="toggleTripFilter()"><svg class="btn-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="2" y="5" width="12" height="9" rx="1.5"/><path d="M5.5 5V3h5v2M2 9h12"/></svg>出張</button>
                </div>
                <div class="header-right">
                    <div style="position:relative;display:none;" id="archive_btn_wrap">
                        <button class="btn" onclick="toggleArchiveMenu(event)">アーカイブ ▾</button>
                        <div id="archive_dropdown_menu">
                            <div onclick="openArchiveManager()">アーカイブ管理</div>
                            <div onclick="openArchiveList()">アーカイブ一覧</div>
                        </div>
                    </div>
                    <button class="btn" id="help_btn" onclick="openHelp()" title="使い方ガイド">?</button>
                    <button class="btn btn-auth" id="auth_btn" onclick="handleAuthBtn()">ログイン</button>
                </div>
            </div>
            <div class="header-row" id="project_info_row">
                <div class="zoom-controls">
                    <button class="btn zoom-btn active" id="zoom_day_btn" onclick="setZoom('day', this)">日</button>
                    <button class="btn zoom-btn" id="zoom_week_btn" onclick="setZoom('week', this)">週</button>
                </div>
                <button class="btn" id="today_btn" onclick="scrollToToday()"><svg class="btn-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="8" cy="8" r="5.5"/><circle cx="8" cy="8" r="1.8" fill="currentColor"/></svg>今日へ</button>
                <button class="btn btn-info" id="resource_toggle" onclick="toggleResourceView()">担当者別リソース</button>
                <button class="btn" id="col_menu_btn" onclick="toggleColMenu(event)"><svg class="btn-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="2" y="3" width="12" height="10" rx="1.5"/><path d="M6.5 3v10M9.5 3v10"/></svg>表示する列 ▾</button>
                <button class="btn btn-primary" id="create_task_btn" onclick="createTask()" style="display:none;"><svg class="btn-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 3v10M3 8h10"/></svg>タスク追加</button>
                <button class="btn" id="multi_delete_btn" onclick="deleteSelectedTasks()" style="display:none;">選択削除 (<span id="multi_delete_count">0</span>件)</button>
                <div class="mark-legend" id="mark_legend"><span><svg width="15" height="15" viewBox="0 0 16 16"><path d="M8 1.5 15 14H1z" fill="#1f2933" stroke="#1f2933" stroke-width="1" stroke-linejoin="round"/><rect x="7.2" y="5.5" width="1.6" height="4.6" rx="0.8" fill="#fff"/><circle cx="8" cy="12" r="0.95" fill="#fff"/></svg>期限切れ</span><span><svg width="14" height="14" viewBox="0 0 16 16"><rect x="2.5" y="1.5" width="1.6" height="13" rx="0.8" fill="#1f2933"/><path d="M4 2h9l-2.2 3.2L13 8.5H4z" fill="#1f2933"/></svg>期日超過</span><span><i class="due-tri"></i>期日</span></div>
                <div class="owner-legend" id="owner_legend"></div>
            </div>
            <div class="header-row" id="dropdowns_row" style="height:0;padding:0;border:none;overflow:visible;">
                <div id="project_filter_wrap" style="position:relative;">
                    <div id="project_filter_dropdown" style="display:none; position:absolute; top:calc(100% + 2px); left:0; background:#fff; border:1px solid #ccc; border-radius:3px; z-index:9999; padding:4px 0; min-width:160px; box-shadow:0 2px 8px rgba(0,0,0,0.15);">
                        <div class="col-filter-sort-row" onclick="applyColumnSort('asc', 'project_number')"><span class="col-filter-sort-icon">A↓</span>昇順</div>
                        <div class="col-filter-sort-row" onclick="applyColumnSort('desc', 'project_number')"><span class="col-filter-sort-icon">Z↓</span>降順</div>
                        <div class="col-filter-dropdown-sep"></div>
                        <label style="display:block; padding:4px 10px; cursor:pointer; white-space:nowrap; font-size:13px; font-family:'メイリオ',Meiryo,sans-serif;">
                            <input type="checkbox" id="project_chk_all" onchange="projectFilterAllChanged(this)" checked> 全選択
                        </label>
                        <div style="border-top:1px solid #eee; margin:2px 0;"></div>
                        <div id="project_chk_list" style="overflow-y:auto; max-height:220px;"></div>
                        <div style="border-top:1px solid #eee; margin:2px 0;"></div>
                        <div class="new-project-box">
                            <div class="new-project-label">新しい工事番号</div>
                            <div style="display:flex; gap:6px;">
                                <input type="text" id="new_project_input" placeholder="例: 2835" onkeydown="if(event.key==='Enter') addNewProjectFilter()">
                                <button type="button" class="new-project-add" onclick="addNewProjectFilter()">追加</button>
                            </div>
                        </div>
                    </div>
                </div>
                <div id="machine_filter_wrap" style="position:relative; display:none;">
                    <div id="machine_filter_dropdown" style="display:none; position:absolute; top:calc(100% + 2px); left:0; background:#fff; border:1px solid #ccc; border-radius:3px; z-index:9999; padding:4px 0; min-width:130px; box-shadow:0 2px 8px rgba(0,0,0,0.15);">
                        <div class="col-filter-sort-row" onclick="applyColumnSort('asc', 'machine')"><span class="col-filter-sort-icon">A↓</span>昇順</div>
                        <div class="col-filter-sort-row" onclick="applyColumnSort('desc', 'machine')"><span class="col-filter-sort-icon">Z↓</span>降順</div>
                        <div class="col-filter-sort-row" onclick="hideColumnFromFilter('machine')"><span class="col-filter-sort-icon">⊘</span>この列を非表示</div>
                        <div class="col-filter-dropdown-sep"></div>
                        <label style="display:block; padding:4px 10px; cursor:pointer; white-space:nowrap; font-size:13px; font-family:'メイリオ',Meiryo,sans-serif;">
                            <input type="checkbox" id="machine_chk_all" onchange="machineFilterAllChanged(this)" checked> 全選択
                        </label>
                        <div style="border-top:1px solid #eee; margin:2px 0;"></div>
                        <div id="machine_chk_list" style="overflow-y:auto; max-height:220px;"></div>
                    </div>
                </div>
                <div id="unit_filter_wrap" style="position:relative; display:none;">
                    <div id="unit_filter_dropdown" style="display:none; position:absolute; top:calc(100% + 2px); left:0; background:#fff; border:1px solid #ccc; border-radius:3px; z-index:9999; padding:4px 0; min-width:130px; box-shadow:0 2px 8px rgba(0,0,0,0.15);">
                        <div class="col-filter-sort-row" onclick="applyColumnSort('asc', 'unit')"><span class="col-filter-sort-icon">A↓</span>昇順</div>
                        <div class="col-filter-sort-row" onclick="applyColumnSort('desc', 'unit')"><span class="col-filter-sort-icon">Z↓</span>降順</div>
                        <div class="col-filter-sort-row" onclick="hideColumnFromFilter('unit')"><span class="col-filter-sort-icon">⊘</span>この列を非表示</div>
                        <div class="col-filter-dropdown-sep"></div>
                        <label style="display:block; padding:4px 10px; cursor:pointer; white-space:nowrap; font-size:13px; font-family:'メイリオ',Meiryo,sans-serif;">
                            <input type="checkbox" id="unit_chk_all" onchange="unitFilterAllChanged(this)" checked> 全選択
                        </label>
                        <div style="border-top:1px solid #eee; margin:2px 0;"></div>
                        <div id="unit_chk_list" style="overflow-y:auto; max-height:220px;"></div>
                    </div>
                </div>
                <div id="owner_filter_wrap" style="position:relative; display:none;">
                    <div id="owner_filter_dropdown" style="display:none; position:absolute; top:calc(100% + 2px); left:0; background:#fff; border:1px solid #ccc; border-radius:3px; z-index:9999; padding:4px 0; min-width:130px; box-shadow:0 2px 8px rgba(0,0,0,0.15);">
                        <div class="col-filter-sort-row" onclick="applyColumnSort('asc', 'owner')"><span class="col-filter-sort-icon">A↓</span>昇順</div>
                        <div class="col-filter-sort-row" onclick="applyColumnSort('desc', 'owner')"><span class="col-filter-sort-icon">Z↓</span>降順</div>
                        <div class="col-filter-sort-row" onclick="hideColumnFromFilter('owner')"><span class="col-filter-sort-icon">⊘</span>この列を非表示</div>
                        <div class="col-filter-dropdown-sep"></div>
                        <label style="display:block; padding:4px 10px; cursor:pointer; white-space:nowrap; font-size:13px; font-family:'メイリオ',Meiryo,sans-serif;">
                            <input type="checkbox" id="owner_chk_all" onchange="ownerFilterAllChanged(this)" checked> 全選択
                        </label>
                        <div style="border-top:1px solid #eee; margin:2px 0;"></div>
                        <div id="owner_chk_list" style="overflow-y:auto; max-height:220px;"></div>
                    </div>
                </div>
            </div>
        </div>
        <div class="gantt-host" id="gantt_host">
            <div id="gantt_here" style="width:100%;"></div>
        </div>

        <!-- グリッド列ヘッダー用の共有フィルタードロップダウン（開いた列に応じて内容を差し替え） -->
        <div id="col_filter_dropdown" class="col-filter-dropdown" style="display:none;">
            <div class="col-filter-sort-row" onclick="applyColumnSort('asc')"><span class="col-filter-sort-icon">A↓</span>昇順</div>
            <div class="col-filter-sort-row" onclick="applyColumnSort('desc')"><span class="col-filter-sort-icon">Z↓</span>降順</div>
            <div class="col-filter-sort-row" onclick="hideColumnFromFilter()"><span class="col-filter-sort-icon">⊘</span>この列を非表示</div>
            <div class="col-filter-dropdown-sep"></div>
            <label>
                <input type="checkbox" id="col_filter_chk_all" checked> 全選択
            </label>
            <div class="col-filter-dropdown-sep"></div>
            <div id="col_filter_chk_list" class="col-filter-dropdown-list"></div>
        </div>

        <!-- 表示する列メニュー -->
        <div id="col_menu" class="col-filter-dropdown" style="display:none;">
            <div class="col-menu-title">表示する列</div>
            <div id="col_menu_list" class="col-filter-dropdown-list"></div>
            <div class="col-filter-dropdown-sep"></div>
            <div style="display:flex; justify-content:flex-end;"><button type="button" onclick="showAllColumns()">すべて表示</button></div>
        </div>

        <!-- 独立したリソースパネル -->
        <div id="resource_panel">
            <div id="resource_resizer"></div>
            <!-- 担当別モード（全画面）専用：日・週の切り替えと今日へ -->
            <div id="resource_zoom_bar">
                <div class="zoom-controls">
                    <button class="btn zoom-btn" id="resource_zoom_day_btn" onclick="setResourceZoom('day')">日</button>
                    <button class="btn zoom-btn" id="resource_zoom_week_btn" onclick="setResourceZoom('week')">週</button>
                </div>
                <button class="btn" id="resource_today_btn" onclick="resourceScrollToToday()"><svg class="btn-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="8" cy="8" r="5.5"/><circle cx="8" cy="8" r="1.8" fill="currentColor"/></svg>今日へ</button>
            </div>
            <div class="resource-header-bar">
                <div style="display:flex; align-items:center; gap:10px;">
                    <button type="button" class="btn" id="resource_back_btn" onclick="showOwnerOverview()" title="一覧に戻る" style="display:none;">←</button>
                    <span id="resource_title">担当者別リソース</span>
                    <span id="resource_mark_legend" class="resource-mark-legend" style="display:none;"><span><svg class="mark-late" width="15" height="15" viewBox="0 0 16 16"><path d="M8 1.5 15 14H1z" fill="#1f2933" stroke="#1f2933" stroke-width="1" stroke-linejoin="round"/><rect x="7.2" y="5.5" width="1.6" height="4.6" rx="0.8" fill="#fff"/><circle cx="8" cy="12" r="0.95" fill="#fff"/></svg>期限切れ</span><span><svg class="mark-wish" width="14" height="14" viewBox="0 0 16 16"><rect x="2.5" y="1.5" width="1.6" height="13" rx="0.8" fill="#1f2933"/><path d="M4 2h9l-2.2 3.2L13 8.5H4z" fill="#1f2933"/></svg>期日超過</span></span>
                </div>
                <button type="button" class="resource-header-close" id="resource_close_btn" title="リソース画面を閉じる">×</button>
            </div>
            <div id="resource_calendar_header"></div>
            <div class="resource-content">
                <div id="resource_content_inner" class="resource-content-inner">
                    <!-- ここにJSでHTMLが挿入される -->
                </div>
            </div>
        </div>
    </div>


    <!-- アーカイブ管理モーダル -->
    <div class="archive-overlay" id="archive_manager_overlay">
        <div class="archive-dialog">
            <h3>アーカイブ管理</h3>
            <div class="archive-table" id="archive_manager_table"></div>
            <div class="archive-dialog-footer">
                <button class="btn" onclick="closeArchiveManager()">閉じる</button>
            </div>
        </div>
    </div>

    <!-- アーカイブ一覧モーダル -->
    <div class="archive-overlay" id="archive_list_overlay">
        <div class="archive-dialog">
            <h3 id="archive_list_title">アーカイブ一覧</h3>
            <div class="archive-table" id="archive_list_table"></div>
            <div class="archive-dialog-footer">
                <button class="btn" onclick="closeArchiveList()">閉じる</button>
            </div>
        </div>
    </div>

    <!-- タスク詳細モーダル -->
    <div class="archive-overlay" id="archive_detail_overlay">
        <div id="archive_detail_dialog">
            <h3 id="archive_detail_title">タスク一覧</h3>
            <div class="archive-tabs">
                <button class="archive-tab-btn" id="dtab_drawing"        onclick="switchArchiveDetailTab('drawing')">図面</button>
                <button class="archive-tab-btn" id="dtab_long_lead_item" onclick="switchArchiveDetailTab('long_lead_item')">長納期品</button>
                <button class="archive-tab-btn" id="dtab_business_trip"  onclick="switchArchiveDetailTab('business_trip')">出張</button>
                <button class="archive-tab-btn" id="dtab_planning"       onclick="switchArchiveDetailTab('planning')">計画</button>
            </div>
            <div class="archive-table" id="archive_detail_table"></div>
            <div class="archive-dialog-footer">
                <button class="btn btn-info" onclick="openArchiveCopyFromDetail()">このモードをコピー</button>
                <button class="btn" onclick="closeArchiveDetail()">閉じる</button>
            </div>
        </div>
    </div>

    <!-- コピー先工事番号入力ダイアログ -->
    <div class="archive-overlay" id="archive_copy_overlay">
        <div class="archive-dialog" style="width:340px; max-height:none;">
            <h3>工事番号を入力してコピー</h3>
            <div style="margin-bottom:8px; font-size:12px; color:#555;">
                コピー元: <span id="archive_copy_src"></span>
            </div>
            <div style="margin-bottom:14px;">
                <label style="font-size:12px; display:block; margin-bottom:4px;">新しい工事番号</label>
                <input type="text" id="archive_copy_input" style="width:100%; box-sizing:border-box; padding:6px 8px; font-size:13px; border:1px solid #ccc; border-radius:3px; font-family:'メイリオ',Meiryo,sans-serif;">
            </div>
            <div class="archive-dialog-footer">
                <button class="btn" onclick="closeArchiveCopy()">キャンセル</button>
                <button class="btn btn-primary" onclick="executeArchiveCopy()">コピーして追加</button>
            </div>
        </div>
    </div>

    <!-- 複数行一括編集モーダル -->
    <div class="archive-overlay" id="multi_edit_overlay">
        <div class="archive-dialog" style="width:760px; max-width:96vw;">
            <h3>選択した行を一括編集</h3>
            <div id="multi_edit_count_label" style="margin-bottom:10px; font-size:12px; color:#555;"></div>
            <div id="multi_edit_form" class="multi-edit-grid"></div>
            <div class="multi-edit-note">入力した項目だけ更新します。空欄の項目は変更しません。</div>
            <div class="archive-dialog-footer">
                <button class="btn" onclick="closeMultiEditModal()">キャンセル</button>
                <button class="btn btn-primary" onclick="applyMultiEdit()">選択行を更新</button>
            </div>
        </div>
    </div>

<!-- ===== パスワード設定ダイアログ（招待メール・パスワードリセット用） ===== -->
<div id="setpw_overlay">
    <div id="setpw_dialog">
        <h2>パスワードを設定してください</h2>
        <p>設計工程表で使用するパスワードを設定します</p>
        <input type="password" id="setpw_pw1" placeholder="新しいパスワード（8文字以上）">
        <input type="password" id="setpw_pw2" placeholder="パスワードを再入力"
               onkeydown="if(event.key==='Enter') doSetPassword()">
        <div id="setpw_error"></div>
        <button id="setpw_btn_submit" onclick="doSetPassword()">パスワードを設定する</button>
    </div>
</div>

<!-- ===== ヘルプツールチップコンテナ ===== -->
<div id="help_tips_container"></div>

<!-- ===== ログインダイアログ ===== -->
<div id="login_overlay">
    <div id="login_dialog">
        <h2>設計工程表 ログイン</h2>
        <button type="button" id="login_ms_btn" class="login-ms-btn" onclick="doMicrosoftLogin()" style="display:none">
            <svg width="18" height="18" viewBox="0 0 21 21" aria-hidden="true"><rect x="1" y="1" width="9" height="9" fill="#f25022"/><rect x="11" y="1" width="9" height="9" fill="#7fba00"/><rect x="1" y="11" width="9" height="9" fill="#00a4ef"/><rect x="11" y="11" width="9" height="9" fill="#ffb900"/></svg>
            Microsoftでサインイン
        </button>
        <div id="login_ms_divider" class="login-divider" style="display:none"><span>または</span></div>
        <div id="login_password_area">
            <input type="email" id="login_email" placeholder="メールアドレス" autocomplete="email">
            <input type="password" id="login_password" placeholder="パスワード" autocomplete="current-password"
                   onkeydown="if(event.key==='Enter') doLogin()">
            <button id="login_btn_submit" onclick="doLogin()">ログイン</button>
        </div>
        <div id="login_error"></div>
        <button id="login_btn_cancel" onclick="closeLoginDialog()">キャンセル</button>
    </div>
</div>

    <script src="resource.js?v=20261120k"></script>
    <script src="m365-login.js?v=20261116"></script>
    <script src="auth.js?v=20261114b"></script>
    <script src="gantt-setup.js?v=20261120f"></script>
    <script src="data.js?v=20261114b"></script>
    <script src="archive.js"></script>
</body>
</html>
